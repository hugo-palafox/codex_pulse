name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        shell: pwsh
        run: dotnet publish .\CodexPulse.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --output .\publish

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item .\Install-CodexPulse.ps1 .\publish\Install-CodexPulse.ps1
          Copy-Item .\Uninstall-CodexPulse.ps1 .\publish\Uninstall-CodexPulse.ps1
          Copy-Item .\README.md .\publish\README.md
          Copy-Item .\LICENSE .\publish\LICENSE
          Compress-Archive -Path .\publish\* -DestinationPath .\CodexPulse-${{ github.ref_name }}-win-x64.zip -Force

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ".\CodexPulse-${{ github.ref_name }}-win-x64.zip" --title "Codex Pulse ${{ github.ref_name }}" --generate-notes
